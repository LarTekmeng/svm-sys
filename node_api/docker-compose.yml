services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env                # <-- load DB_* into the API container
    environment:
      - ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mynetwork

  db:
    image: postgres:15-alpine
    env_file:
      - .env                # <-- load DB_* for Postgres init
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mynetwork

volumes:
  pgdata:

networks:
  mynetwork:
